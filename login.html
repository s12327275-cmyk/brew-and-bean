
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Brew & Bean | Login</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        /* ==================================
           LOGIN PAGE - FULL BACKGROUND
        ================================== */

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        .auth-page {
            min-height: 100vh;
            min-height: 100dvh;

            width: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 45px 20px;

            background:
                    linear-gradient(
                            rgba(35, 21, 14, 0.48),
                            rgba(35, 21, 14, 0.62)
                    ),
                    url("images/login-bg.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* ==================================
           LOGIN CARD
        ================================== */

        .auth-card {
            width: 100%;
            max-width: 470px;

            background: rgba(255, 255, 255, 0.96);

            border: 1px solid #EDE0D5;
            border-radius: 20px;

            padding: 42px 38px;

            box-shadow:
                    0 20px 55px rgba(0, 0, 0, 0.25);
        }

        /* LOGO */

        .auth-logo {
            display: block;

            text-align: center;
            text-decoration: none;

            color: #8D5C3C;

            font-size: 23px;
            font-weight: 800;

            margin-bottom: 30px;
        }

        /* HEADING */

        .auth-card h1 {
            font-family: Georgia, serif;

            color: #30201A;

            font-size: 36px;
            text-align: center;

            margin: 0 0 14px;
        }

        .auth-subtitle {
            color: #756057;

            font-size: 14px;
            line-height: 1.8;

            text-align: center;

            margin: 0 0 30px;
        }

        /* ==================================
           FORM
        ================================== */

        .auth-field {
            margin-bottom: 22px;
        }

        .auth-field label {
            display: block;

            color: #30201A;

            font-size: 13px;
            font-weight: 700;

            margin-bottom: 10px;
        }

        .auth-field input {
            display: block;

            width: 100%;

            padding: 15px;

            background: #FFFCFA;

            border: 1px solid #E1D2C5;
            border-radius: 9px;

            color: #30201A;

            font-family: Arial, sans-serif;
            font-size: 14px;

            outline: none;

            transition: border-color 0.3s;
        }

        .auth-field input:focus {
            border-color: #8D5C3C;
        }

        /* LOGIN BUTTON */

        .auth-submit {
            display: block;

            width: 100%;

            padding: 16px;

            background: #8D5C3C;

            color: #FFFFFF;

            border: none;
            border-radius: 9px;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            margin-top: 8px;

            transition:
                    background 0.3s,
                    transform 0.3s;
        }

        .auth-submit:hover {
            background: #6D432C;
            transform: translateY(-2px);
        }

        /* MESSAGES */

        .auth-message {
            font-size: 13px;
            text-align: center;
            line-height: 1.7;
            margin: 15px 0 0;
        }

        .auth-message.error {
            color: #B34343;
        }

        .auth-message.success {
            color: #3B7652;
        }

        /* BOTTOM LINKS */

        .auth-bottom {
            text-align: center;

            color: #756057;

            font-size: 13px;

            margin-top: 28px;
        }

        .auth-bottom a {
            color: #8D5C3C;
            font-weight: 700;
            text-decoration: none;
        }

        .auth-bottom a:hover,
        .auth-back:hover {
            text-decoration: underline;
        }

        .auth-back {
            display: block;

            text-align: center;

            color: #8D5C3C;

            font-size: 13px;
            text-decoration: none;

            margin-top: 24px;
        }

        .auth-demo-note {
            color: #9A877B;

            font-size: 11px;
            line-height: 1.7;

            text-align: center;

            margin: 25px 0 0;
        }

        /* ==================================
           MOBILE
        ================================== */

        @media (max-width: 600px) {

            .auth-page {
                padding: 25px 15px;

                background-position: center;
            }

            .auth-card {
                padding: 30px 23px;
                border-radius: 16px;
            }

            .auth-logo {
                font-size: 20px;
            }

            .auth-card h1 {
                font-size: 30px;
            }

            .auth-subtitle {
                font-size: 13px;
            }

        }

    </style>

</head>

<body>

<main class="auth-page">

    <div class="auth-card">

        <!-- LOGO -->

        <a href="index.html" class="auth-logo">
            ☕ BREW & BEAN
        </a>

        <!-- TITLE -->

        <h1>Welcome Back!</h1>

        <p class="auth-subtitle">
            Your favorite coffee moments are waiting.
            Sign in to continue.
        </p>

        <!-- LOGIN FORM -->

        <form id="loginForm">

            <div class="auth-field">

                <label for="loginEmail">
                    Email Address
                </label>

                <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                >

            </div>

            <div class="auth-field">

                <label for="loginPassword">
                    Password
                </label>

                <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        minlength="6"
                        required
                >

            </div>

            <button
                    type="submit"
                    class="auth-submit">
                Login →
            </button>

            <p
                    id="loginMessage"
                    class="auth-message"
                    role="status"
                    aria-live="polite">
            </p>

        </form>

        <!-- SIGN UP -->

        <p class="auth-bottom">
            Don't have an account?
            <a href="signup.html">Sign Up</a>
        </p>

        <!-- BACK HOME -->

        <a href="index.html" class="auth-back">
            ← Back to Home
        </a>

        <!-- DEMO NOTE -->

        <p class="auth-demo-note">
            Front-end demo only.
            No real account authentication is performed.
        </p>

    </div>

</main>


<script src="js/main.js" defer></script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Brew & Bean | Sign Up</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        /* ==============================
           RESET
        ============================== */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
        }

        /* ==============================
           FULL SCREEN BACKGROUND
        ============================== */

        .auth-page {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px 20px;

            background-image:
                    linear-gradient(
                            rgba(35, 21, 14, 0.48),
                            rgba(35, 21, 14, 0.62)
                    ),
                    url("images/login-bg.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* ==============================
           SIGN UP CARD
        ============================== */

        .auth-card {
            width: 100%;
            max-width: 470px;

            padding: 38px 36px;

            background: rgba(255, 255, 255, 0.96);

            border: 1px solid #EDE0D5;
            border-radius: 20px;

            box-shadow:
                    0 20px 55px rgba(0, 0, 0, 0.25);
        }

        /* LOGO */

        .auth-logo {
            display: block;

            margin-bottom: 24px;

            color: #8D5C3C;

            font-size: 23px;
            font-weight: 800;
            text-align: center;
            text-decoration: none;
        }

        /* TITLE */

        .auth-card h1 {
            margin: 0 0 12px;

            color: #30201A;

            font-family: Georgia, serif;
            font-size: 34px;
            text-align: center;
        }

        .auth-subtitle {
            margin: 0 0 28px;

            color: #756057;

            font-size: 14px;
            line-height: 1.7;
            text-align: center;
        }

        /* ==============================
           FORM FIELDS
        ============================== */

        .auth-field {
            margin-bottom: 18px;
        }

        .auth-field label {
            display: block;

            margin-bottom: 9px;

            color: #30201A;

            font-size: 13px;
            font-weight: 700;
        }

        .auth-field input {
            display: block;
            width: 100%;

            padding: 14px;

            background: #FFFCFA;

            border: 1px solid #E1D2C5;
            border-radius: 9px;

            color: #30201A;

            font-family: Arial, sans-serif;
            font-size: 14px;

            outline: none;

            transition:
                    border-color 0.3s,
                    box-shadow 0.3s;
        }

        .auth-field input:focus {
            border-color: #8D5C3C;

            box-shadow:
                    0 0 0 3px rgba(141, 92, 60, 0.12);
        }

        /* ==============================
           CREATE ACCOUNT BUTTON
        ============================== */

        .auth-submit {
            display: block;
            width: 100%;

            padding: 16px;

            margin-top: 8px;

            background: #8D5C3C;

            color: #FFFFFF;

            border: none;
            border-radius: 9px;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            transition:
                    background 0.3s,
                    transform 0.3s;
        }

        .auth-submit:hover {
            background: #6D432C;
            transform: translateY(-2px);
        }

        /* ==============================
           FORM MESSAGES
        ============================== */

        .auth-message {
            margin: 15px 0 0;

            font-size: 13px;
            line-height: 1.7;
            text-align: center;
        }

        .auth-message.error {
            color: #B34343;
        }

        .auth-message.success {
            color: #3B7652;
        }

        /* ==============================
           BOTTOM LINKS
        ============================== */

        .auth-bottom {
            margin-top: 24px;

            color: #756057;

            font-size: 13px;
            text-align: center;
        }

        .auth-bottom a {
            color: #8D5C3C;

            font-weight: 700;
            text-decoration: none;
        }

        .auth-bottom a:hover,
        .auth-back:hover {
            text-decoration: underline;
        }

        .auth-back {
            display: block;

            margin-top: 20px;

            color: #8D5C3C;

            font-size: 13px;
            text-align: center;
            text-decoration: none;
        }

        .auth-demo-note {
            margin: 22px 0 0;

            color: #9A877B;

            font-size: 11px;
            line-height: 1.7;
            text-align: center;
        }

        /* ==============================
           MOBILE RESPONSIVE
        ============================== */

        @media (max-width: 600px) {

            .auth-page {
                padding: 25px 15px;
                background-position: center;
            }

            .auth-card {
                padding: 28px 22px;
                border-radius: 16px;
            }

            .auth-logo {
                font-size: 20px;
            }

            .auth-card h1 {
                font-size: 28px;
            }

            .auth-subtitle {
                font-size: 13px;
            }

            .auth-field input {
                padding: 13px;
            }

        }

    </style>

</head>

<body>

<main class="auth-page">

    <div class="auth-card">

        <!-- LOGO -->

        <a href="index.html" class="auth-logo">
            ☕ BREW & BEAN
        </a>

        <!-- TITLE -->

        <h1>Join Our Coffee Club</h1>

        <p class="auth-subtitle">
            Create your demo account and become
            part of the Brew & Bean community.
        </p>

        <!-- SIGN UP FORM -->

        <form id="signupForm">

            <!-- FULL NAME -->

            <div class="auth-field">

                <label for="signupName">
                    Full Name
                </label>

                <input
                        type="text"
                        id="signupName"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        maxlength="60"
                        required
                >

            </div>

            <!-- EMAIL -->

            <div class="auth-field">

                <label for="signupEmail">
                    Email Address
                </label>

                <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                >

            </div>

            <!-- PASSWORD -->

            <div class="auth-field">

                <label for="signupPassword">
                    Password
                </label>

                <input
                        type="password"
                        id="signupPassword"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                >

            </div>

            <!-- CONFIRM PASSWORD -->

            <div class="auth-field">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                >

            </div>

            <!-- SUBMIT -->

            <button type="submit" class="auth-submit">
                Create Account →
            </button>

            <!-- MESSAGE -->

            <p
                    id="signupMessage"
                    class="auth-message"
                    role="status"
                    aria-live="polite">
            </p>

        </form>

        <!-- LOGIN LINK -->

        <p class="auth-bottom">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

        <!-- BACK TO HOME -->

        <a href="index.html" class="auth-back">
            ← Back to Home
        </a>

        <!-- DEMO NOTE -->

        <p class="auth-demo-note">
            Front-end demo only.
            No real account or password is stored.
        </p>

    </div>

</main>


<script src="js/main.js" defer></script>
</body>
</html>
